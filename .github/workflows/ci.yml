name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Deterministic demo (hash stable between runs)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          cargo run -p agent_cli -- run-demo --in demo/inputs/config.txt --out out
           = (Get-FileHash out/trace.json -Algorithm SHA256).Hash

          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          cargo run -p agent_cli -- run-demo --in demo/inputs/config.txt --out out
           = (Get-FileHash out/trace.json -Algorithm SHA256).Hash

          if ( -ne ) {
            Write-Error "Non-deterministic output detected:  vs "
            exit 1
          }

          cargo run -p agent_cli -- verify-trace --trace out/trace.json
