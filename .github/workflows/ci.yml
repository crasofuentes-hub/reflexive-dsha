name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-windows:
    name: windows-latest / rust build + tests + determinism
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Deterministic demo (trace hash stable between runs)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          cargo run -p agent_cli -- run-demo --in demo/inputs/config.txt --out out
          $h1 = (Get-FileHash "out/trace.json" -Algorithm SHA256).Hash

          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          cargo run -p agent_cli -- run-demo --in demo/inputs/config.txt --out out
          $h2 = (Get-FileHash "out/trace.json" -Algorithm SHA256).Hash

          if ($h1 -ne $h2) {
            Write-Error "Non-deterministic output detected: $h1 vs $h2"
            exit 1
          }

          cargo run -p agent_cli -- verify-trace --trace out/trace.json

  formal_lean:
    name: formal/ (Lean + Lake)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        shell: pwsh
        run: |
          # Instala elan (no dependas de PATH ni de profile)
          iwr https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -UseBasicParsing | iex

          $elanBin = Join-Path $HOME ".elan\bin"
          $elan    = Join-Path $elanBin "elan.exe"
          $lake    = Join-Path $elanBin "lake.exe"
          $lean    = Join-Path $elanBin "lean.exe"

          if (!(Test-Path $elan)) { throw "elan.exe not found at $elan" }
          if (!(Test-Path $lake)) { throw "lake.exe not found at $lake" }
          if (!(Test-Path $lean)) { throw "lean.exe not found at $lean" }

          & $elan --version
          & $lake --version
          & $lean --version

      - name: Build formal proofs
        shell: pwsh
        run: |
          Set-Location .\formal
          if (Test-Path .\.lake) { Remove-Item -Recurse -Force .\.lake }

          $elanBin = Join-Path $HOME ".elan\bin"
          $lake    = Join-Path $elanBin "lake.exe"
          $lean    = Join-Path $elanBin "lean.exe"

          # Opcional: imprime toolchain real usado
          & $lean --version
          & $lake update
          & $lake build
