name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  formal_lean:
    name: formal/ (Lean + Lake)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        shell: pwsh
        run: |
          iwr https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -UseBasicParsing | iex
          elan --version

      - name: Build formal proofs
        shell: pwsh
        run: |
          Set-Location .\formal
          if (Test-Path .\.lake) { Remove-Item -Recurse -Force .\.lake }
          lake update
          lake build
